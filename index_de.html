    <div class="hidden" id="screen_cover" onclick="close_popup()">
        <div id="img_popup" onclick="ignore_click_event()">
            <p class="close_button" onclick="close_popup()">Schließen</p>
            <img id="image_to_show" />
            <div class="button_group">
                <p id="prev_button" class="hand_cursor">Vorheriges</p>
                <p id="next_button" class="hand_cursor">Nächstes</p>
            </div>
        </div>
    </div>

    <script>
        function on_img_clicked(image) {
            load_image(image)
            open_popup()
        }

        function open_popup() {
            var popup = document.getElementById("screen_cover");
            popup.classList.remove("hidden");
        }

        function close_popup() {
            var popup = document.getElementById("screen_cover");
            if (!popup.classList.contains("hidden")) {
                popup.classList.add("hidden");
            }
        }

        function load_image(image) {
            var img = document.getElementById("image_to_show");
            img.setAttribute("src", image.getAttribute("src"));

            var previous_button = document.getElementById("prev_button");
            setup_navigation_button(previous_button, image.previousElementSibling)
            var next_button = document.getElementById("next_button");
            setup_navigation_button(next_button, image.nextElementSibling);
        }

        function setup_navigation_button(button, image) {
            if(button) {
                if (image) {
                    button.classList.remove("hidden");
                    button.onclick = function() {
                        event.cancelBubble = true;
                        load_image(image);
                    };
                }
                else {
                    button.onclick = function() {ignore_click_event();};
                    if (!button.classList.contains("hidden")) {
                        button.classList.add("hidden");
                    }
                }
            }
        }

        function ignore_click_event() {
            event.cancelBubble = true;
        }
    </script>
